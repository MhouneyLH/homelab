---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-read-all-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-read-all-rb
subjects:
  - kind: User
    name: EdgeLordKirito
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: homelab-read-all-role
  apiGroup: rbac.authorization.k8s.io
