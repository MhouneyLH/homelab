---
adminUser: admin
adminPassword: "admin"

# Ensure we don't use an existing secret
admin:
  existingSecret: ""

# only 2 replicasets with 0 replicas set for rollback purposes
revisionHistoryLimit: 2

service:
  type: NodePort
  port: 3000
  nodePort: 30070

nodeSelector:
  kubernetes.io/hostname: hl-worker-01

# Configure Prometheus and OpenTelemetry Collector as data sources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
        uid: prometheus

      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        uid: loki

      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy
        uid: tempo
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: k8s.namespace.name
                value: namespace
              - key: k8s.pod.name
                value: pod
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

# Import some useful dashboards
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    argo-cd:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/argo_cd_dashboard.json
    kubernetes-cluster:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/k8s_cluster_dashboard.json
    mosquitto:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/mosquitto_dashboard.json
    node-exporter:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/node_exporter_dashboard.json
    prometheus:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/prometheus_dashboard.json
    traefik:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/traefik_dashboard.json
    cert-manager:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/cert_manager_dashboard.json
    wg-gesucht:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/wg_gesucht_dashboard.json
    n8n-health-overview:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/n8n_health_overview_dashboard.json
    loki-overview:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/loki_overview_dashboard.json
    tempo-and-otelc-overview:
      url: https://raw.githubusercontent.com/MhouneyLH/homelab/master/src/k8s/apps/monitoring/grafana/dashboards/tempo_and_otelc_overview_dashboard.json
