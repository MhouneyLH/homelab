---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mosquitto-mqtt
  namespace: services
spec:
  entryPoints:
    - mqtt # defined in the traefik config to listen on port 1883
  routes:
      # Plain MQTT has no SNI, so use HostSNI(*) and rely on local DNS/hosts.
    - match: HostSNI(`*`)
      services:
        - name: mosquitto
          port: 1883
