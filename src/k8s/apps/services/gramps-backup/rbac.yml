---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gramps-backup
  namespace: services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gramps-backup
  namespace: services
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gramps-backup
  namespace: services
subjects:
  - kind: ServiceAccount
    name: gramps-backup
    namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gramps-backup
