---
# Usage:
# kubectl -n services apply -f src/k8s/apps/services/gramps-backup/backup-inspect-pod.yml
# kubectl -n services exec gramps-backup-inspect -- ls -lh /backup/archives
# kubectl -n services cp gramps-backup-inspect:/backup/archives/gramps-YYYYMMDD-HHMMSS.tar.gz ./
# kubectl -n services cp gramps-backup-inspect:/backup/archives ./gramps-archives
# kubectl -n services exec gramps-backup-inspect -- tar -czf - -C /backup archives | tar -xzvf - -C .
# kubectl -n services delete pod gramps-backup-inspect --ignore-not-found
# Debian install: sudo apt update && sudo apt install sqlitebrowser
apiVersion: v1
kind: Pod
metadata:
  name: gramps-backup-inspect
  namespace: services
spec:
  restartPolicy: Never
  containers:
    - name: inspect
      image: alpine:3.22.4
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: backup
          mountPath: /backup
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: gramps-backup
