---
# Kubernetes Secret for the n8n owner account.
# Do NOT commit this file with real values.
# Generate and apply it with:  scripts/apply-n8n-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: n8n-owner
  namespace: automation
type: Opaque
stringData:
  N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
  N8N_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME}
  N8N_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME}
  N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD}
