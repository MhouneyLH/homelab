---
nodeSelector:
  kubernetes.io/hostname: hl-worker-01

# Internal-only for now (see main README's "Managing internal communication" NodePort table) -
# no ingress/TLS/public DNS. Node IPs are treated as sensitive in this repo (see main README,
# .env), so this stays a placeholder here - swap <worker-node-ip> for the real one locally, same
# as with any other NodePort service.
externalURL: http://<worker-node-ip>:30002

expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    ports:
      http:
        port: 80
        nodePort: 30002

# Real values live in Secrets created directly in the cluster (not committed here) - see
# README.md next to this file for how they were created and why.
existingSecretSecretKey: harbor-secret-key
existingSecretAdminPassword: harbor-admin-password
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

persistence:
  persistentVolumeClaim:
    registry:
      storageClass: local-path
    jobservice:
      jobLog:
        storageClass: local-path
    database:
      storageClass: local-path
    redis:
      storageClass: local-path
    trivy:
      storageClass: local-path
